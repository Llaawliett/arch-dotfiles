shell /bin/fish


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
font_size	 14
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# CURSOR TRAIL
cursor_trail 20
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 1

## OS window close

confirm_os_window_close 0
